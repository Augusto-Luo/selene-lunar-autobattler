<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f12" />
    <meta name="description" content="A lunar tactical autobattler. Deploy units, set orders and watch your decisions shape the battle." />
    <title>SELENE // Tranquility Line</title>
    <style>
      .boot-screen{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#080711;color:#f0e6cf;font-family:system-ui,sans-serif;transition:opacity 160ms ease-out}
      .boot-screen.is-leaving{opacity:0;pointer-events:none}
      .boot-content{width:min(360px,calc(100vw - 48px));text-align:center}
      .boot-emblem{display:block;width:42px;height:42px;margin:0 auto 32px;border:2px solid #f0b55f;transform:rotate(45deg);box-shadow:5px 5px 0 #322337;position:relative}
      .boot-emblem:after{content:"";position:absolute;inset:10px;border:2px solid #71d7d3}
      .boot-title{font:900 38px "Courier New",monospace;letter-spacing:.24em;margin:0 0 24px;text-indent:.24em}
      .boot-status{min-height:42px;margin:0;color:#b9adba;font-size:14px;line-height:1.5}
      .boot-track{height:9px;margin:14px 0 12px;background:#191527;border:1px solid #41344f;text-align:left;overflow:hidden}
      .boot-fill{display:block;height:100%;width:0;background:#71d7d3;transition:width 160ms ease-out}
      .boot-count{font:12px "Courier New",monospace;color:#b9adba;letter-spacing:.12em}
      .boot-retry{margin-top:18px;padding:10px 22px;border:2px solid #f0b55f;background:#191527;color:#f0e6cf;font:inherit;cursor:pointer}
      .boot-retry:focus-visible{outline:2px solid #71d7d3;outline-offset:4px}
      @media(prefers-reduced-motion:reduce){.boot-screen,.boot-fill{transition:none}}
    </style>
  </head>
  <body>
    <div id="boot-screen" class="boot-screen" role="status" aria-live="polite">
      <div class="boot-content">
        <span class="boot-emblem" aria-hidden="true"></span>
        <h1 class="boot-title">SELENE</h1>
        <p id="boot-status" class="boot-status">Preparing the lunar battlefield…</p>
        <div id="boot-progress" class="boot-track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><span id="boot-fill" class="boot-fill"></span></div>
        <span id="boot-count" class="boot-count">0 / 4</span>
        <button id="boot-retry" class="boot-retry" type="button" hidden>Reload</button>
      </div>
    </div>
    <div id="app"></div>
    <noscript><p style="position:fixed;z-index:201;inset:60% 24px auto;color:#f0e6cf;text-align:center">Enable JavaScript to play SELENE.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
